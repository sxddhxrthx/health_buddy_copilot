name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      PORT: '3001'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Type-check, build and run unit/API tests
        run: npm run check
      - name: Install Microsoft Edge for both browser projects
        run: npx playwright install msedge
      - name: Run desktop and mobile-emulation browser tests
        run: npm run test:e2e
      - name: Check patch whitespace
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ($env:PR_BASE_SHA) {
            git diff --check "$env:PR_BASE_SHA...HEAD"
          } else {
            git show --format= --check HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
      - name: Retain synthetic failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
